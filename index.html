        <h1 style="color: #047857;">SukuPass Togo — Les badges scolaires en quelques clics</h1>
        <p><strong>SukuPass Togo</strong> est la plateforme de référence pour les collèges, lycées et écoles du Togo et de l'espace UEMOA pour concevoir, gérer et imprimer les cartes d'identité scolaires des élèves.</p>
        
        <h2>Fonctionnalités principales</h2>
        <ul>
          <li><strong>Importation Excel/CSV en 3 secondes</strong> : chargez les listes de classes entières directement depuis vos fichiers administratifs.</li>
          <li><strong>QR Code dynamique et sécurisé</strong> : vérification instantanée de l'authenticité de la carte contre les fraudes.</li>
          <li><strong>Fonds anti-falsification</strong> : motifs guillochés, filigranes nationaux et armoiries du Togo.</li>
          <li><strong>Webcam intégrée</strong> : prise de vue directe de la photo d'identité de l'élève sur place.</li>
          <li><strong>Exportation PDF A4 haute résolution</strong> : planches prêtes à découper et à plastifier.</li>
          <li><strong>Mode Hors-Ligne 100% fonctionnel</strong> : travaillez sans interruption même en cas de coupure de courant ou d'internet.</li>
        </ul>

        <h2>Tarifs & Abonnements</h2>
        <ul>
          <li><strong>Plan Découverte Gratuit</strong> : 0 F CFA / à vie (jusqu'à 15 élèves).</li>
          <li><strong>Plan Établissement PRO</strong> : 30 000 F CFA / an (Cartes illimitées, logos personnalisés, aucun filigrane, support WhatsApp direct).</li>
          <li><strong>Plan Inspection & Multi-écoles</strong> : sur mesure pour complexes scolaires et inspections régionales.</li>
        </ul>
